[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zt"
version = "0.1.0"
description = "Zerodha intraday bot: candles, backtest, strategy lab, signals"
requires-python = ">=3.11"
dependencies = [
    "kiteconnect==5.2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pysqlite3-binary; sys_platform == 'linux'",
]

[project.optional-dependencies]
export = ["pandas>=2.2", "openpyxl>=3.1"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.12", "pre-commit>=4"]

[project.scripts]
zt = "zt.cli:main"

[tool.setuptools.packages.find]
include = ["zt*"]

[tool.setuptools.package-data]
zt = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["zt", "tests"]
